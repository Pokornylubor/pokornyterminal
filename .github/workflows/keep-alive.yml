name: Keep Streamlit Alive

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: |
          curl -sL "https://pokornyterminal.streamlit.app" || true
          echo "Ping odeslán, aplikace by měla být probuzena!"