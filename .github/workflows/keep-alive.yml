name: Keep Streamlit Alive

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install Selenium
        run: pip install selenium
          
      - name: Simulace realne navstevy pres Chrome
        run: |
          python -c "
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          import time
          
          options = Options()
          options.add_argument('--headless')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-dev-shm-usage')
          
          print('Oteviram neviditelny Chrome...')
          driver = webdriver.Chrome(options=options)
          
          try:
              driver.get('https://pokornyterminal.streamlit.app')
              print('Stranka nactena. Cekam 10 vterin na inicializaci WebSocketu...')
              time.sleep(10)
              print('Aplikace je nyni plne probuzena a aktivni.')
          except Exception as e:
              print(f'Chyba: {e}')
          finally:
              driver.quit()
          "