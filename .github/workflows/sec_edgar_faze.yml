name: Aktualizace SEC EDGAR

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aktualizace:
    runs-on: ubuntu-latest
    steps:
      - name: Stáhnout kód repozitáře
        uses: actions/checkout@v3

      - name: Nastavit Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Instalace knihoven
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Spuštění stahování SEC
        run: python sec_updater.py

      - name: Uložení nových dat do cloudu
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global pull.rebase false
          git add .
          git commit -m "Automatická aktualizace (Cloud - SEC EDGAR)" || exit 0
          git pull --no-edit
          git push