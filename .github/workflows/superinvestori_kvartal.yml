name: Kvartalni Aktualizace Superinvestori

on:
  schedule:
    - cron: '0 3 15 2,5,8,11 *'
  workflow_dispatch:  # <--- Toto umožňuje odpálení tlačítkem ze Streamlitu!

jobs:
  aktualizace:
    runs-on: ubuntu-latest
    steps:
      - name: Stáhnout kód repozitáře
        uses: actions/checkout@v3

      - name: Nastavit Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Instalace knihoven
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Spuštění stahování Superinvestoru
        run: python updater.py

      - name: Uložení nových dat do cloudu
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Automatická aktualizace (Cloud - Superinvestoři)" || exit 0
          git pull --no-edit
          git push