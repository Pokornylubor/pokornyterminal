name: Aktualizace Dat

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aktualizace:
    runs-on: ubuntu-latest
    steps:
      - name: Stáhnout kód repozitáře
        uses: actions/checkout@v3

      - name: Nastavit Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalace knihoven
        run: pip install pandas requests cloudscraper yfinance beautifulsoup4 lxml

      - name: Spuštění stahování
        run: python updater.py
             python sec_updater.py

      - name: Uložení nových dat do cloudu
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Automatická aktualizace dat (Cloud)" || echo "Žádná nová data"
          git push
